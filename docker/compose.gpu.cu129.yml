#############################
###    shared settings    ###
#############################
x-common-settings: &common
  build:
    context: ..
    dockerfile: docker/dockerfile.gpu.cu129
  image: hrcnthu/visualnav:gpu-torch-cuda12.9-rtx5090

  volumes:
    # GUI support for ROS applications
    - $HOME/.Xauthority:/root/.Xauthority:ro
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - /etc/localtime:/etc/localtime:ro
    
    # Workspace volume
    - ../workspace:/workspace

  environment:
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    - DISPLAY=${DISPLAY}
    - XAUTHORITY=/root/.Xauthority
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=all

    # Device access
    - "/dev:/dev"
    - "/dev/shm:/dev/shm"

  # Network mode for SSH X11 forwarding
  network_mode: host
  ipc: host
  
  # Container settings
  tty: true
  stdin_open: true
  privileged: true
  stop_grace_period: 1s
  working_dir: /workspace

############################
###   GPU settings       ###
############################
x-gpu-settings: &gpu
  runtime: nvidia
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  
  environment:
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=all
    - CUDA_VISIBLE_DEVICES=all


##############################
###   Container Services   ###
##############################
services:
  deploy:
    <<: [*common, *gpu]
    container_name: visualnav-deploy-gpu-cu129
    command: ["/bin/bash"]
  dev:
    <<: [*common, *gpu]
    container_name: visualnav-dev-gpu-cu129
    command: ["/bin/bash"]
