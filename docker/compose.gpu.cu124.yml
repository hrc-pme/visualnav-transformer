#############################
###    shared settings    ###
#############################
x-common-settings: &common
  build:
    context: ..
    dockerfile: docker/dockerfile.gpu.cu124
  image: hrcnthu/visualnav:gpu-torch-cuda12.4

  volumes:
    # GUI support for ROS applications
    - $HOME/.Xauthority:/root/.Xauthority
    - /tmp/.X11-unix:/tmp/.X11-unix
    
    # Workspace volume
    - ../workspace:/workspace

  environment:
    - ROS_DOMAIN_ID=25
    - DISPLAY=${DISPLAY}
    - XAUTHORITY=/tmp/.docker.xauth

  # ROS2 communication settings
  network_mode: "host"
  ipc: host
  
  # Container settings
  tty: true
  stdin_open: true
  privileged: true
  stop_grace_period: 1s
  working_dir: /workspace

############################
###   GPU settings       ###
############################
x-gpu-settings: &gpu
  runtime: nvidia
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  
  environment:
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=all


##############################
###   Container Services   ###
##############################
services:
  deploy:
    <<: [*common, *gpu]
    container_name: visualnav-deploy-gpu
    command: ["/bin/bash"]
  dev:
    <<: [*common, *gpu]
    container_name: visualnav-dev-gpu
    command: ["/bin/bash"]