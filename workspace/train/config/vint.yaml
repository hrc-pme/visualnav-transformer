# ============================================================================
# FREQUENTLY CHANGED SETTINGS - Modify these for your experiments
# ============================================================================

# Training Name (used only during training to name the output model)
training_name: "vint_baseline"

# Dataset Configuration
# NOTE: The training script will automatically scan and use ALL datasets in train/datasets/
# Each dataset should have:
#   - datasets/<name>/processed_data/<name>/  (with trajectory folders)
#   - vint_train/data/data_splits/<name>/train/traj_names.txt
#   - vint_train/data/data_splits/<name>/test/traj_names.txt
# Use train/data/data.yaml to configure recording and processing for new datasets

# Fine-tuning Configuration
# Option 1: Fine-tune from official foundation models (recommended)
use_foundation_model: true     # Use official ViNT/GNM/NoMaD foundation model as starting point
foundation_model_path: "/workspace/deployment/model_weights"  # Path to foundation models

# Option 2: Fine-tune from your own previous training run
# load_run: "vint_baseline_2025_11_07_001234"  # Uncomment to fine-tune from a previous run
                                                # Model will be loaded from /workspace/model/{load_run}/
                                                # Note: use_foundation_model will be ignored if load_run is set

# Training Hyperparameters
batch_size: 16        # Batch size (reduce if GPU memory is limited)
epochs: 30            # Number of training epochs
learning_rate: 5e-4   # Initial learning rate
num_workers: 0        # Number of data loading workers (set to 0 to avoid multiprocessing issues)

# Project Settings
run_name: vint         # Model run name (will be appended with timestamp)
use_wandb: True        # Enable Weights & Biases logging (set to False to disable)
wandb_entity: null     # WandB entity (null = use default, or specify your username/team)

# ============================================================================
# ADVANCED SETTINGS - Modify only if needed
# ============================================================================

# training setup
train: True
gpu_ids: [0]
lr: 5e-4
optimizer: adamw
clipping: False
max_norm: 1.
scheduler: "cosine"
warmup: True 
warmup_epochs: 4
cyclic_period: 10
plateau_patience: 3
plateau_factor: 0.5
seed: 0

# model params
model_type: vint
obs_encoder: "efficientnet-b0" # by default, this is imagenet pretrained
obs_encoding_size: 512
use_pretrained: true           # Use ImageNet pretrained weights (highly recommended for small datasets)
mha_num_attention_heads: 4
mha_num_attention_layers: 4
mha_ff_dim_factor: 4
late_fusion: False

# normalization for the action space
normalize: True

# context
context_type: temporal
context_size: 2  # Reduced from 5 for small datasets
# tradeoff between action and distance prediction loss
alpha: 0.5

# distance bounds for distance and action and distance predictions 
distance:
  min_dist_cat: 0
  max_dist_cat: 20
action:
  min_dist_cat: 0
  max_dist_cat: 10
close_far_threshold: 10 # distance threshold used to seperate the close and the far  subgoals that are sampled per datapoint

# action output params
len_traj_pred: 5
learn_angle: True

# dataset specific parameters
image_size: [85, 64] # width, height
goal_type: "image"

# Default dataset parameters (applied to all auto-discovered datasets)
# These can be overridden per dataset if needed
default_dataset_params:
  end_slack: 0                # adjust based on your data quality
  goals_per_obs: 3            # increase goal sampling for data augmentation
  negative_mining: true       # negative mining from the ViNG paper (Shah et al.)

# Legacy datasets section - kept for reference or manual override
# The training script will auto-discover all datasets in train/datasets/
# and apply the default_dataset_params above
datasets:
  1106_631_test:
    data_folder: /workspace/train/datasets/1106_631_test/processed_data/1106_631_test
    train: /workspace/train/vint_train/data/data_splits/1106_631_test/train/
    test: /workspace/train/vint_train/data/data_splits/1106_631_test/test/
    end_slack: 0
    goals_per_obs: 3
    negative_mining: True

# logging stuff
## =0 turns off
print_log_freq: 100 # in iterations
image_log_freq: 1000 #0 # in iterations
num_images_log: 8 #0 
pairwise_test_freq: 0 # in epochs
eval_fraction: 0.25
wandb_log_freq: 10 # in iterations
eval_freq: 1 # in epochs